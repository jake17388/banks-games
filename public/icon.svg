<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3FD8"/>
      <stop offset="1" stop-color="#151E6E"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FFFFFF"/><g transform="translate(-24 -20)">
  <!-- playing card -->
  <g transform="rotate(-14 430 470)" filter="url(#sh)">
    <rect x="270" y="230" width="330" height="460" rx="40" fill="url(#bg)"/>
    <rect x="300" y="260" width="270" height="400" rx="22" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.9"/>
  </g>
  <!-- die -->
  <g transform="rotate(12 640 640)" filter="url(#sh)">
    <rect x="480" y="480" width="320" height="320" rx="64" fill="#FFC93C"/>
    <g fill="#151E6E">
      <circle cx="560" cy="560" r="30"/>
      <circle cx="640" cy="640" r="30"/>
      <circle cx="720" cy="720" r="30"/>
      <circle cx="720" cy="560" r="30"/>
      <circle cx="560" cy="720" r="30"/>
    </g>
  </g>
</g></svg>
